
<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/x-icon" href="newtabicon.ico">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>snipedbysno</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      font-family: Inter, sans-serif;
      color: white;
    }

    body {
      background:
        radial-gradient(
          800px 450px at 10% 15%,
          rgba(255, 0, 0, 0.20),
          transparent
        ),
        radial-gradient(
          700px 400px at 90% 85%,
          rgba(180, 0, 0, 0.22),
          transparent
        ),
        linear-gradient(
          135deg,
          #000000,
          #170000,
          #050000,
          #000000
        );

      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .wrap {
      width: 100%;
      max-width: 420px;
    }

    .card {
      background: rgba(15, 0, 0, 0.75);
      border: 1px solid rgba(255, 30, 30, 0.18);
      padding: 28px;
      border-radius: 16px;

      box-shadow:
        0 18px 50px rgba(0, 0, 0, 0.8),
        0 0 35px rgba(255, 0, 0, 0.08);
    }

    .profile {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 22px;
      overflow: hidden;
      margin-bottom: 16px;

      border: 2px solid rgba(255, 0, 0, 0.5);

      box-shadow:
        0 0 15px rgba(255, 0, 0, 0.35),
        0 8px 24px rgba(0, 0, 0, 0.8);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .handle {
      color: #ff4545;
      font-size: 13px;
      margin-top: 6px;
    }

    .search-row {
      display: flex;
      gap: 8px;
      margin-top: 24px;
      width: 100%;
    }

    .search-row input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border-radius: 10px;

      border: 1px solid rgba(255, 0, 0, 0.25);
      background: rgba(0, 0, 0, 0.5);

      color: white;
      font-size: 14px;
      outline: none;
    }

    .search-row input:focus {
      border-color: #ff3030;
      box-shadow: 0 0 10px rgba(255, 0, 0, 0.2);
    }

    .search-row button {
      padding: 10px 15px;
      border-radius: 10px;
      border: none;

      background: #d90000;
      color: white;

      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .search-row button:hover {
      background: #ff2020;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
    }

    @media (max-width: 460px) {
      .card {
        padding: 20px;
      }

      .avatar {
        width: 98px;
        height: 98px;
      }
    }
  </style>
</head>

<body>

  <div class="wrap card">

    <div class="profile">

      <div class="avatar">
        <img
          id="discordAvatar"
          src="https://cdn.discordapp.com/embed/avatars/0.png"
          alt="Discord Profile Picture"
        >
      </div>

      <h1>snipedbysno</h1>

      <div class="handle">@snipedbysno</div>

      <form
        class="search-row"
        action="https://www.google.com/search"
        method="GET"
        target="_blank"
      >
        <input
          name="q"
          type="search"
          placeholder="Search Google..."
          aria-label="Search Google"
        >

        <button type="submit">Search</button>
      </form>

    </div>

  </div>

  <script>
    const DISCORD_ID = "1122671474554187846";

    const avatar = document.getElementById("discordAvatar");

    async function updateDiscordAvatar() {
      try {
        const response = await fetch(
          `https://api.lanyard.rest/v1/users/${DISCORD_ID}`
        );

        if (!response.ok) {
          throw new Error("Could not retrieve Discord profile");
        }

        const result = await response.json();

        if (!result.success || !result.data.discord_user) {
          throw new Error("Discord user unavailable");
        }

        const user = result.data.discord_user;

        if (user.avatar) {
          const extension = user.avatar.startsWith("a_")
            ? "gif"
            : "png";

          const avatarURL =
            `https://cdn.discordapp.com/avatars/${DISCORD_ID}/${user.avatar}.${extension}?size=256`;

          if (avatar.src !== avatarURL) {
            avatar.src = avatarURL;
          }
        }

      } catch (error) {
        console.error("Discord avatar update failed:", error);
      }
    }

    // Update immediately when the page opens.
    updateDiscordAvatar();

    // Check for avatar changes every 60 seconds.
    setInterval(updateDiscordAvatar, 60000);

  </script>

</body>
</html>

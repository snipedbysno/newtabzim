<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>snipedbysno</title>
  <link rel="icon" type="image/x-icon" href="newtabicon.ico">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      color: white;
      background:
        radial-gradient(ellipse at center, #350000 0%, transparent 65%),
        linear-gradient(135deg, #000000, #160000, #000000);
    }

    .container {
      text-align: center;
      padding: 40px;
      width: 90%;
      max-width: 450px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 0, 0, 0.4);
      border-radius: 18px;
      box-shadow: 0 0 35px rgba(255, 0, 0, 0.2);
    }

    .avatar {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #ff2020;
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.5);
      margin-bottom: 20px;
    }

    h1 {
      font-size: 32px;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .username {
      color: #ff5555;
      margin-bottom: 30px;
      font-size: 15px;
    }

    .search {
      display: flex;
      width: 100%;
    }

    .search input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      background: #111;
      color: white;
      border: 1px solid #550000;
      border-radius: 8px 0 0 8px;
      outline: none;
      font-size: 14px;
    }

    .search input:focus {
      border-color: #ff2020;
    }

    .search button {
      padding: 13px 17px;
      background: #b00000;
      color: white;
      border: none;
      border-radius: 0 8px 8px 0;
      cursor: pointer;
      transition: 0.2s;
    }

    .search button:hover {
      background: #ed0000;
    }
  </style>
</head>

<body>
  <div class="container">
    <img
      id="discordAvatar"
      class="avatar"
      src="https://cdn.discordapp.com/avatars/1122671474554187846/87b7eacbe0d54e9446b28184da8be449.webp?size=1024"
      alt="Discord Profile Picture"
    >

    <h1>snipedbysno</h1>
    <p class="username">@snipedbysno</p>

    <form class="search" action="https://www.google.com/search" method="GET">
      <input
        type="text"
        name="q"
        placeholder="Search Google..."
        autocomplete="off"
      >
      <button type="submit">Search</button>
    </form>
  </div>

  <script>
    const DISCORD_ID = "1122671474554187846";

    const avatar = document.getElementById("discordAvatar");

    // Your current avatar is the fallback.
    const FALLBACK_AVATAR =
      "https://cdn.discordapp.com/avatars/1122671474554187846/87b7eacbe0d54e9446b28184da8be449.webp?size=1024";

    async function updateDiscordAvatar() {
      try {
        const response = await fetch(
          `https://api.lanyard.rest/v1/users/${DISCORD_ID}`
        );

        if (!response.ok) {
          throw new Error("Lanyard could not find this Discord user.");
        }

        const result = await response.json();
        const user = result.data.discord_user;

        if (!user || !user.id) {
          throw new Error("Discord user information unavailable.");
        }

        if (user.avatar) {
          const extension = user.avatar.startsWith("a_")
            ? "gif"
            : "webp";

          const newAvatar =
            `https://cdn.discordapp.com/avatars/${DISCORD_ID}/${user.avatar}.${extension}?size=1024`;

          if (avatar.src !== newAvatar) {
            avatar.src = newAvatar;
          }
        }
      } catch (error) {
        console.log("Using saved avatar:", error.message);
      }
    }

    // Check immediately when the website loads.
    updateDiscordAvatar();

    // Check again every 60 seconds.
    setInterval(updateDiscordAvatar, 60000);
  </script>
</body>
</html>
